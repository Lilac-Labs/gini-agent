name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The old single job ran typecheck -> test -> build sequentially (~3 min).
  # They are independent, so run them as parallel matrix legs on separate
  # runners: wall-clock becomes the slowest leg, not the sum. Shared setup
  # (checkout + bun + cached install) is deduped across legs by the matrix, and
  # zsh — an ~11s apt install only the runtime terminal-exec tests need — is
  # installed only on the legs that need it.
  ci:
    name: ${{ matrix.leg }}
    runs-on: ubuntu-latest
    # The five most recent successful runs of the old monolithic job took
    # 1m30s-2m22s end to end. Without a cap, a wedged `bun test` runs until
    # GitHub's 6-hour force-cancel, burning a runner and red-checking the PR
    # hours later (issue #289). 15 minutes is well over any real leg, so the cap
    # only fires on a genuine hang.
    timeout-minutes: 15
    strategy:
      # Run every leg even if one fails, so a PR shows all failures at once
      # instead of masking the rest behind the first red leg.
      fail-fast: false
      matrix:
        include:
          - leg: typecheck
            cmd: bun run typecheck
          # Runtime/skills/mobile suite — the heaviest work (~115s in one leg),
          # so split across 4 shards with `bun test --shard=i/4` (each runs a
          # quarter of the test FILES) that run on separate runners in parallel.
          # terminal_exec / code_exec wrap commands through `zsh -lc`
          # (packages/runtime/src/agent.ts:buildPtySpawnArgs and the non-PTY
          # spawn path both assume zsh on $PATH), so these legs need zsh; the
          # runner ships bash only.
          - leg: test-runtime 1/4
            cmd: bun test --parallel --shard=1/4 ./packages/runtime/src ./skills ./packages/mobile/src ./packages/mobile/plugins
            zsh: true
          - leg: test-runtime 2/4
            cmd: bun test --parallel --shard=2/4 ./packages/runtime/src ./skills ./packages/mobile/src ./packages/mobile/plugins
            zsh: true
          - leg: test-runtime 3/4
            cmd: bun test --parallel --shard=3/4 ./packages/runtime/src ./skills ./packages/mobile/src ./packages/mobile/plugins
            zsh: true
          - leg: test-runtime 4/4
            cmd: bun test --parallel --shard=4/4 ./packages/runtime/src ./skills ./packages/mobile/src ./packages/mobile/plugins
            zsh: true
          # Web suite (the old `posttest` hook). --isolate runs each file in a
          # fresh process; kept for parity. zsh in case a web test shells out.
          - leg: test-web
            cmd: bun --cwd=packages/web test --isolate
            zsh: true
          # Build the prod web bundle and prove it boots + answers healthz.
          - leg: build-web
            cmd: bash scripts/ci-web-build-probe.sh
    steps:
      - uses: actions/checkout@v7

      # Keep Bun at 1.3.14 or newer. 1.3.13 intermittently wedged
      # `bun test --parallel` after every test passed: a worker's event loop
      # never drained, the run never printed its summary, and the job sat until
      # the 6-hour force-cancel with two orphan `bun` workers (issue #289). Bun
      # 1.3.14 fixed the responsible subprocess bugs (leaked PipeReader poll
      # keep-alive ref, dropped subprocess 'exit' events on Linux under the
      # EPOLLONESHOT pidfd race, and subprocess objects kept alive when a
      # grandchild inherits the stdio pipe) — all shapes this suite exercises.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Cache Bun's global download cache (NOT node_modules — restoring an 86k-file
      # node_modules tree via actions/cache measured ~12-25s, slower than a warm
      # `bun install` itself, so it's a net loss). The download cache is small and
      # lets `bun install --frozen-lockfile` resolve from disk instead of the
      # network. Keyed on bun.lock; restore-keys let a dependency bump reuse the
      # prior cache as a base.
      - name: Cache bun download cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install zsh
        if: matrix.zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # One workspace install covers every package (runtime, web, mobile)
      # against the single root lockfile.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Next.js incremental build cache — makes the prod build reuse compiled
      # output across runs. Best-effort: restore-keys fall back to any prior
      # Next cache for this OS when the source-hash key misses.
      - name: Cache Next.js build
        if: matrix.leg == 'build-web'
        uses: actions/cache@v6
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('packages/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: ${{ matrix.leg }}
        run: ${{ matrix.cmd }}

  # The main-protection ruleset requires a status check named exactly
  # "typecheck, test, build" (the old single job's name). Splitting the work
  # into parallel legs would drop that context and block every PR, so keep it as
  # a zero-work aggregate gate: it passes only when every leg passed. Branch
  # protection keeps pointing at this one stable name; the legs stay internal.
  gate:
    name: typecheck, test, build
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI legs to pass
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI legs did not all pass (result: ${{ needs.ci.result }})"
            exit 1
          fi
          echo "all CI legs passed"
